[build]
  publish = "frontend"
  command = "echo 'Tidak perlu build, hanya file statis + functions'"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "cors", "serverless-http", "@netlify/blobs"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
